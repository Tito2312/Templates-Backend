# Puerto
server.port=${PORT:8080}

# Base de Datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sac_templates_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dsu9h5isd}
cloudinary.api-key=${CLOUDINARY_API_KEY:743194587867865}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:d1EDW2XajIvs1mLI1Nogt0P--Kc}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mantener al menos 2 conexiones siempre abiertas y listas
spring.datasource.hikari.minimum-idle=2
# Limitar el maximo para no saturar la BD gratuita
spring.datasource.hikari.maximum-pool-size=10
# Tiempo maximo de vida de una conexion (10 minutos)
spring.datasource.hikari.max-lifetime=600000
# Cuanto tiempo esperar antes de cerrar una conexion inactiva (5 minutos)
spring.datasource.hikari.idle-timeout=300000