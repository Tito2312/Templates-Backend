# Configuración SOLO para pruebas (sustituye a src/main/resources/application.properties en el classpath de test).
# Usa H2 en memoria en modo PostgreSQL: las pruebas nunca se conectan a Supabase ni a la BD local.

spring.datasource.url=jdbc:h2:mem:sac_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Valores ficticios: CloudinaryService los exige al arrancar, pero ninguna prueba sube imágenes
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Secreto JWT solo para pruebas (los tokens que se generan aquí no sirven fuera de ellas)
jwt.secret=ClaveDePruebasSoloParaTestsUnitariosDeSacPlantillas0123456789
